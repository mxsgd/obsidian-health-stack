models:
  - name: fct_daily
    description: One row per day. The table every dashboard reads from.
    columns:
      - name: date
        data_tests: [unique, not_null]
      - name: plan_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [done, planned, skipped, extra, rest]
      - name: food_status
        description: kcal vs target. not_logged = no FatSecret entry; incomplete = under half the target.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [not_logged, no_target, incomplete, under, on_target, over]
      - name: sleep_h
        description: Sleep that ended this morning. From the watch when there is a Health note, else typed in the day note.
      - name: cardio_min
        description: Watch workouts except strength sessions (strength comes from the gym log).
      - name: next_energy
        description: Energy the following morning, i.e. the outcome of this day.

  - name: fct_exercise_sessions
    description: One row per exercise per day with set volume and estimated 1RM progression.
    data_tests:
      - unique_combination:
          arguments:
            columns: [date, exercise]

  - name: fct_weekly_training
    description: Planned vs done strength sessions per week.
    columns:
      - name: week_start
        data_tests: [unique, not_null]
      - name: adherence
        data_tests: [{ between: { arguments: { min: 0, max: 1 } } }]
