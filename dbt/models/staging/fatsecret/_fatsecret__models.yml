models:
  - name: stg_fatsecret__daily
    description: Daily intake from the FatSecret diary. Days with nothing logged have no row.
    columns:
      - name: date
        data_tests: [unique, not_null]
      - name: kcal
        data_tests: [not_null, { between: { arguments: { min: 0, max: 8000 } } }]
      - name: protein_g
        data_tests: [{ between: { arguments: { min: 0, max: 500 } } }]
