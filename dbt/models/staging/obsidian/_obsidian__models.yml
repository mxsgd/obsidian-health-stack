models:
  - name: stg_obsidian__checkins
    description: Morning ratings (1-5) from day notes.
    columns:
      - name: date
        data_tests: [unique, not_null]
      - name: energy
        data_tests: [{ between: { arguments: { min: 1, max: 5 } } }]
      - name: mood
        data_tests: [{ between: { arguments: { min: 1, max: 5 } } }]
      - name: gut
        data_tests: [{ between: { arguments: { min: 1, max: 5 } } }]

  - name: stg_obsidian__sets
    description: One row per strength set.
    columns:
      - name: reps
        description: Null when the set text did not parse. Fix the workout note.
        data_tests:
          - not_null:
              config: { severity: warn }
          - between: { arguments: { min: 1, max: 100 } }
      - name: weight_kg
        data_tests: [{ between: { arguments: { min: 0, max: 400 } } }]

  - name: stg_obsidian__health
    description: Watch data per day (Redmi Watch → Mi Fitness → Apple Health → Shortcut).
    columns:
      - name: date
        data_tests: [unique, not_null]
      - name: sleep_h
        data_tests: [{ between: { arguments: { min: 0, max: 16 } } }]
      - name: resting_hr
        data_tests: [{ between: { arguments: { min: 30, max: 120 } } }]
      - name: steps
        data_tests: [{ between: { arguments: { min: 0, max: 100000 } } }]

  - name: stg_obsidian__workouts
    description: One row per watch workout.
    columns:
      - name: duration_min
        description: Null when the workout line did not parse. Check the Shortcut's output.
        data_tests:
          - not_null:
              config: { severity: warn }
          - between: { arguments: { min: 1, max: 600 } }
      - name: distance_km
        data_tests: [{ between: { arguments: { min: 0, max: 300 } } }]
      - name: kcal
        data_tests: [{ between: { arguments: { min: 0, max: 5000 } } }]

  - name: stg_obsidian__plan
    columns:
      - name: weekday
        data_tests:
          - accepted_values:
              arguments:
                values: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]

  - name: stg_obsidian__goals
    columns:
      - name: kcal_training
        data_tests: [{ between: { arguments: { min: 800, max: 6000 } } }]
      - name: kcal_rest
        data_tests: [{ between: { arguments: { min: 800, max: 6000 } } }]
      - name: protein_training
        data_tests: [{ between: { arguments: { min: 0, max: 400 } } }]
      - name: protein_rest
        data_tests: [{ between: { arguments: { min: 0, max: 400 } } }]
